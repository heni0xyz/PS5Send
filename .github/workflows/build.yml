name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            python-arch: x64
            artifact_path: dist/PS5Send-Windows
          - os: macos-26
            platform: macos-x64
            python-arch: x64
            artifact_path: PS5Send-macos-x64.zip
          - os: macos-latest
            platform: macos-arm64
            python-arch: arm64
            artifact_path: PS5Send-macos-arm64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller ps5send.spec

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PS5Send.app ${{ matrix.artifact_path }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5Send-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14
          if-no-files-found: error
